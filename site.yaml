  encargos:
    activa: true
    antetitulo: Por encargo
    titulo: Tartas y bandejas para tus celebraciones
    texto: "Cumpleaños, desayunos de empresa o una merienda en casa. Te preparamos tartas enteras, bandejas de bollería y cajas de desayuno para llevar."
    imagen: /fotos/encargos.jpg
    items:

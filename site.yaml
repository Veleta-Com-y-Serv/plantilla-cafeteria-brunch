  sobre:
    activa: true
    antetitulo: Nosotros
    titulo: Un café de barrio con horno propio
    declaracion: "Lo hacemos todo aquí, cada mañana, y sin atajos."
    texto: |
      Café Almendro abrió en 2019 en una casa antigua de la calle Santiago, a dos pasos del Campo del Príncipe. Lo llevamos Lucía, en el obrador, y Andrés, detrás de la barra.

      El café lo tuesta un pequeño tostador andaluz y lo cambiamos según la temporada. El pan es de masa madre y fermenta toda la noche.

      Las tartas, los bizcochos y las mermeladas salen de nuestro horno. Si algo se acaba, se acaba: mañana habrá más.
    imagen: /fotos/nosotros.jpg
    items:
      - { titulo: Hecho aquí, texto: "Bizcochos, tartas, granola y mermeladas del obrador de la casa." }
      - { titulo: Producto cercano, texto: "Aceite, miel y fruta de la provincia de Granada." }
      - { titulo: Para todos, texto: "Opciones sin gluten, sin lactosa y veganas cada día." }


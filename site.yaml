      - { titulo: Dinos el día, texto: "Con 48 horas de antelación, y si hay alergias o intolerancias." }
      - { titulo: Recógelo en el café, texto: "Te lo dejamos listo a la hora que nos digas." }
    cta: { texto: Encargar por WhatsApp, url: "https://wa.me/34654214736?text=Hola%2C%20quiero%20hacer%20un%20encargo" }
    cta_secundario: { texto: Escríbenos, url: "/#contacto" }
    nota: "Tartas enteras de 8 a 12 raciones. Para pedidos grandes, mejor por teléfono."

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿Hace falta reservar para el brunch?", respuesta: "Los sábados y domingos, sí: tenemos seis mesas y se llenan. Entre semana suele haber sitio sin reservar." }
      - { pregunta: "¿Tenéis opciones sin gluten?", respuesta: "Sí. Cada día hay al menos un dulce sin gluten y pan sin gluten para las tostadas. Avísanos si eres celíaco y lo preparamos aparte." }
      - { pregunta: "¿Hay leches vegetales?", respuesta: "Sí, de avena, almendra y soja, sin coste extra en cualquier café." }
      - { pregunta: "¿Con cuánta antelación se encarga una tarta?", respuesta: "Con 48 horas basta para casi todas. Para tartas personalizadas o pedidos grandes, mejor con una semana." }
      - { pregunta: "¿Se puede ir con perro?", respuesta: "Sí, en la terraza y dentro del local si es tranquilo. Tenemos agua para ellos en la puerta." }

  contacto:
